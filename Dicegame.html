<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dice Battle 🎲</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
            padding: 30px 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #cfd8dc;
            margin-bottom: 30px;
        }

        /* Player Selection */

        .setup {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 20px;
            max-width: 500px;
            margin: auto;
            backdrop-filter: blur(10px);
        }

        .setup h2 {
            margin-bottom: 20px;
        }

        .player-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        button {
            border: none;
            cursor: pointer;
            padding: 12px 25px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            transition: 0.2s;
        }

        button:hover {
            transform: scale(1.05);
        }

        .player-btn {
            background: #00c6ff;
            color: white;
        }

        .start-btn {
            margin-top: 20px;
            background: #00e676;
            color: #111;
        }

        /* Game */

        #game {
            display: none;
            max-width: 1000px;
            margin: 30px auto;
        }

        .turn {
            font-size: 22px;
            margin-bottom: 25px;
            color: #00e5ff;
        }

        .players {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }

        .player {
            background: rgba(255,255,255,0.12);
            padding: 25px 15px;
            border-radius: 20px;
            border: 2px solid transparent;
            transition: 0.3s;
        }

        .player.active {
            border-color: #00e5ff;
            box-shadow: 0 0 20px rgba(0,229,255,0.4);
        }

        .player h2 {
            margin-bottom: 15px;
        }

        .dice {
            font-size: 75px;
            margin: 15px 0;
            min-height: 90px;
        }

        .score {
            font-size: 20px;
            margin-bottom: 15px;
        }

        .roll-btn {
            background: #ffca28;
            color: #111;
        }

        .reset-btn {
            margin-top: 30px;
            background: #ff5252;
            color: white;
        }

        /* Result */

        .winner {
            margin-top: 30px;
            padding: 20px;
            background: rgba(0,230,118,0.2);
            border-radius: 15px;
            font-size: 25px;
            display: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            .dice {
                font-size: 60px;
            }
        }
    </style>
</head>

<body>

    <h1>🎲 Dice Battle</h1>
    <p class="subtitle">Roll the dice. Get the highest score. Become the champion!</p>

    <!-- SETUP -->
    <div class="setup" id="setup">

        <h2>Select Players</h2>

        <div class="player-buttons">
            <button class="player-btn" onclick="selectPlayers(3)">
                3 Players
            </button>

            <button class="player-btn" onclick="selectPlayers(4)">
                4 Players
            </button>
        </div>

        <p id="selectedText" style="margin-top:20px;">
            Choose number of players
        </p>

        <button class="start-btn" onclick="startGame()">
            Start Game 🚀
        </button>

    </div>


    <!-- GAME -->
    <div id="game">

        <div class="turn" id="turnText">
            Player 1's Turn
        </div>

        <div class="players" id="playersContainer">
        </div>

        <div class="winner" id="winner">
        </div>

        <button class="reset-btn" onclick="resetGame()">
            🔄 New Game
        </button>

    </div>


    <script>

        let numberOfPlayers = 0;
        let currentPlayer = 0;
        let scores = [];
        let gameFinished = false;

        const diceFaces = {
            1: "⚀",
            2: "⚁",
            3: "⚂",
            4: "⚃",
            5: "⚄",
            6: "⚅"
        };


        // Select number of players
        function selectPlayers(number) {

            numberOfPlayers = number;

            document.getElementById("selectedText").innerText =
                number + " Players Selected";

        }


        // Start game
        function startGame() {

            if (numberOfPlayers === 0) {
                alert("Please select 3 or 4 players!");
                return;
            }

            currentPlayer = 0;
            scores = new Array(numberOfPlayers).fill(0);
            gameFinished = false;

            document.getElementById("setup").style.display = "none";
            document.getElementById("game").style.display = "block";

            createPlayers();
            updateTurn();

        }


        // Create player cards
        function createPlayers() {

            const container =
                document.getElementById("playersContainer");

            container.innerHTML = "";

            for (let i = 0; i < numberOfPlayers; i++) {

                const player = document.createElement("div");

                player.className = "player";
                player.id = "player" + i;

                player.innerHTML = `
                    <h2>👤 Player ${i + 1}</h2>

                    <div class="dice" id="dice${i}">
                        🎲
                    </div>

                    <div class="score">
                        Score: <span id="score${i}">0</span>
                    </div>

                    <button
                        class="roll-btn"
                        onclick="rollDice()"
                        id="roll${i}">
                        Roll Dice 🎲
                    </button>
                `;

                container.appendChild(player);
            }
        }


        // Roll dice
        function rollDice() {

            if (gameFinished) return;

            const dice = Math.floor(Math.random() * 6) + 1;

            scores[currentPlayer] += dice;

            document.getElementById(
                "dice" + currentPlayer
            ).innerText = diceFaces[dice];

            document.getElementById(
                "score" + currentPlayer
            ).innerText = scores[currentPlayer];

            nextPlayer();
        }


        // Move to next player
        function nextPlayer() {

            currentPlayer++;

            if (currentPlayer >= numberOfPlayers) {

                currentPlayer = 0;

                // For this version, game ends after everyone rolls once
                endGame();

            } else {

                updateTurn();

            }
        }


        // Highlight current player
        function updateTurn() {

            document.getElementById("turnText").innerText =
                `Player ${currentPlayer + 1}'s Turn`;

            for (let i = 0; i < numberOfPlayers; i++) {

                document
                    .getElementById("player" + i)
                    .classList.remove("active");
            }

            document
                .getElementById("player" + currentPlayer)
                .classList.add("active");
        }


        // Find winner
        function endGame() {

            gameFinished = true;

            let highestScore = Math.max(...scores);

            let winners = [];

            scores.forEach((score, index) => {

                if (score === highestScore) {
                    winners.push(`Player ${index + 1}`);
                }

            });

            const winnerBox =
                document.getElementById("winner");

            if (winners.length === 1) {

                winnerBox.innerHTML =
                    `🏆 ${winners[0]} Wins! <br>
                     Score: ${highestScore}`;

            } else {

                winnerBox.innerHTML =
                    `🤝 It's a Tie! <br>
                     ${winners.join(" & ")}
                     <br>
                     Score: ${highestScore}`;

            }

            winnerBox.style.display = "block";

            document.getElementById("turnText").innerText =
                "🎉 Game Over!";
        }


        // Reset
        function resetGame() {

            numberOfPlayers = 0;
            currentPlayer = 0;
            scores = [];
            document.getElementById("game").style.display = "none";
            document.getElementById("setup").style.display = "block";

            document.getElementById("selectedText").innerText =
                "Choose number of players";

            document.getElementById("winner").style.display = "none";
        }

    </script>

</body>
  </html
